openapi: 3.1.0
info:
  title: API interna de Pastoral Digital
  version: 1.0.0
  description: >-
    Endpoints de solo lectura para herramientas internas de confianza. Deben
    llamarse únicamente desde un backend. Nunca expongas el token Bearer en
    código de navegador, aplicaciones móviles, clientes públicos ni variables
    NEXT_PUBLIC_*.
servers:
  - url: https://id.pastoralmarianaps.net.pe
    description: Producción
security:
  - bearerAuth: []
paths:
  /api/internal/catechists:
    get:
      operationId: listCatechists
      summary: Listar catequistas
      description: >-
        Lista los registros de la tabla users. La base de datos no tiene un
        campo específico que identifique a los catequistas, así que se devuelven
        todos los usuarios. El orden es firstName, lastName y userId. La página
        y el total se obtienen en un solo viaje a la base de datos. Las
        respuestas incluyen Cache-Control: private, no-store, max-age=0.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Página de catequistas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatechistListResponse'
              example:
                success: true
                data:
                  - userId: user_2abc123
                    firstName: Ana
                    lastName: García
                    email: ana@example.org
                    category: teacher
                    schedule: confirmacion
                pagination:
                  limit: 50
                  offset: 0
                  total: 1
                  hasMore: false
        '400':
          $ref: '#/components/responses/InvalidPagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/NotConfigured'

  /api/internal/events:
    get:
      operationId: listEvents
      summary: Listar eventos
      description: >-
        Lista todos los eventos con los datos de su ubicación. El orden es date
        y eventId. La página y el total se obtienen en un solo viaje a la base
        de datos. Las respuestas incluyen Cache-Control: private, no-store,
        max-age=0.
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Página de eventos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
              example:
                success: true
                data:
                  - eventId: 0190abcd-1234-7abc-8def-123456789abc
                    name: Reunión general
                    description: Reunión mensual de catequistas
                    date: '2026-11-22T15:00:00.000Z'
                    secondTurnDate: '2026-11-22T17:00:00.000Z'
                    endDate: '2026-11-22T19:00:00.000Z'
                    location:
                      locationId: 1
                      name: Auditorio
                      address: Av. Ejemplo 123
                      city: Trujillo
                      postalCode: '13001'
                      country: Perú
                      googleMapsUrl: https://maps.example.org/location
                pagination:
                  limit: 50
                  offset: 0
                  total: 1
                  hasMore: false
        '400':
          $ref: '#/components/responses/InvalidPagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/NotConfigured'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token opaco
      description: >-
        El servidor de esta API lee el secreto desde INTERNAL_API_TOKEN. El
        backend consumidor puede guardar el mismo valor con un nombre local
        como PASTORAL_API_TOKEN; ese nombre es opcional y se puede cambiar.
        Envía el valor en Authorization: Bearer <token>. Genera 256 bits con
        `openssl rand -hex 32` y guarda el resultado en el gestor de secretos
        del backend consumidor. Estos endpoints son solo para backend; no los
        llames desde navegadores ni aplicaciones móviles.

  parameters:
    limit:
      name: limit
      in: query
      required: false
      description: Cantidad de registros a devolver. El valor predeterminado es 50.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    offset:
      name: offset
      in: query
      required: false
      description: Cantidad de registros a omitir. El valor predeterminado es 0.
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    Pagination:
      type: object
      required: [limit, offset, total, hasMore]
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
          description: Total de registros antes de aplicar la paginación.
        hasMore:
          type: boolean

    Catechist:
      type: object
      required: [userId, firstName, lastName, email, category, schedule]
      properties:
        userId:
          type: string
          description: ID del usuario en la base de datos de la aplicación (ID de Clerk).
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        category:
          type: string
          enum: [student, alumni, teacher]
        schedule:
          type: string
          enum:
            - full-time
            - primera-comunion
            - confirmacion
            - logistica
            - semilleros
            - coordinador

    EventLocation:
      type: object
      required:
        - locationId
        - name
        - address
        - city
        - postalCode
        - country
        - googleMapsUrl
      properties:
        locationId:
          type: integer
        name:
          type: string
        address:
          type: string
        city:
          type: string
        postalCode:
          type: string
        country:
          type: string
        googleMapsUrl:
          type: string
          format: uri

    Event:
      type: object
      required:
        - eventId
        - name
        - description
        - date
        - secondTurnDate
        - endDate
        - location
      properties:
        eventId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        date:
          type: string
          format: date-time
        secondTurnDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/EventLocation'

    CatechistListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Catechist'
        pagination:
          $ref: '#/components/schemas/Pagination'

    EventListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success:
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          const: false
        error:
          type: string
        details:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

  responses:
    InvalidPagination:
      description: El parámetro limit o offset no pasó la validación de Zod.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Invalid pagination parameters
            details:
              - field: limit
                message: Invalid input
    Unauthorized:
      description: El token Bearer falta o no es válido.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Unauthorized
    ServerError:
      description: Falló la consulta a la base de datos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Failed to fetch events
    NotConfigured:
      description: La API interna no está configurada para atender solicitudes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Internal API is misconfigured
