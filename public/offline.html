<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07309b" />
    <title>Sin conexión | Pastoral Digital</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #111827;
        background: #f3f6fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        width: min(100%, 420px);
        padding: 36px 28px;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        background: white;
        box-shadow: 0 20px 50px rgb(15 23 42 / 10%);
        text-align: center;
      }

      .icon {
        display: grid;
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 20px;
        color: #07309b;
        background: #eaf0ff;
        place-items: center;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
        line-height: 1.25;
      }

      p {
        margin: 12px 0 24px;
        color: #64748b;
        line-height: 1.6;
      }

      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        color: white;
        background: #07309b;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 3l18 18" />
          <path d="M10.6 5.1A8 8 0 0 1 21 12" />
          <path d="M5.6 5.6A8 8 0 0 0 3 12" />
          <path d="M8.5 8.5a5 5 0 0 0-1.4 3.5" />
          <path d="M15.5 15.5A5 5 0 0 0 17 12" />
          <path d="M12 20h.01" />
        </svg>
      </div>
      <h1>No hay conexión a Internet</h1>
      <p>Conéctate a Internet para continuar usando Pastoral Digital.</p>
      <button type="button" onclick="window.location.reload()">
        Reintentar
      </button>
    </main>
  </body>
</html>
