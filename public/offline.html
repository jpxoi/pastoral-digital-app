<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07309b" />
    <title>Sin conexión | Pastoral Digital</title>
    <style>
      :root {
        color-scheme: light;
        --primary: hsl(223 91% 32%);
        --primary-foreground: hsl(223 40% 98%);
        --destructive: oklch(0.577 0.245 27.325);
        --muted: #64748b;
        --background: #ffffff;
        --ring: oklch(0.704 0.04 256.788);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100dvh;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: #0f172a;
        background: var(--primary);
        text-align: center;
      }

      main {
        display: flex;
        width: 100%;
        max-width: 28rem;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2.5rem;
        border-radius: 0.5rem;
        background: var(--background);
        box-shadow:
          0 10px 15px -3px rgb(15 23 42 / 10%),
          0 4px 6px -4px rgb(15 23 42 / 10%);
      }

      .icon {
        color: var(--destructive);
      }

      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        text-wrap: balance;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
        text-wrap: pretty;
      }

      button {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 2rem;
        border: 0;
        border-radius: 0.375rem;
        color: var(--primary-foreground);
        background: var(--primary);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(0.95);
      }

      button:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }

      @media (min-width: 768px) {
        h1 {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        class="icon"
        width="80"
        height="80"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 18h.01" />
        <path d="M9.172 15.172a4 4 0 0 1 5.656 0" />
        <path
          d="M6.343 12.343a8 8 0 0 1 3.864-2.14m4.163.155a8 8 0 0 1 3.687 2"
        />
        <path
          d="M3.515 9.515a12 12 0 0 1 3.544-2.455m3.101-.92a12 12 0 0 1 10.325 3.374"
        />
        <path d="M3 3l18 18" />
      </svg>
      <h1>¡Ups! No hay conexión a Internet</h1>
      <p>
        Verifica tu red Wi-Fi o datos móviles y vuelve a intentarlo para usar
        todas las funciones de Pastoral Digital App.
      </p>
      <button type="button" id="retry">Reintentar</button>
    </main>
    <script>
      const retry = () => window.location.reload()
      document.getElementById('retry').addEventListener('click', retry)
      window.addEventListener('online', retry)
    </script>
  </body>
</html>
